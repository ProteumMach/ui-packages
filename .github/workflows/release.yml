name: Release

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package family to build
        required: true
        type: choice
        options:
          - sdk
      publish:
        description: Publish the reviewed tag to the registries
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.28
          python-version: '3.11'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: node scripts/prepare-release.mjs
        env:
          RELEASE_PACKAGE: ${{ inputs.package }}
          PUBLISH: ${{ inputs.publish }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: |
            release-artifacts/*
          if-no-files-found: error
          retention-days: 3

  publish-npm:
    if: inputs.publish
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-packages
          path: release-artifacts
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.19.0
      - name: Publish TypeScript SDK
        if: inputs.package == 'sdk'
        run: npm publish release-artifacts/toolpath-api-*.tgz --access public

  publish-pypi:
    if: inputs.publish && inputs.package == 'sdk'
    needs:
      - build-and-test
      - publish-npm
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-packages
          path: release-artifacts
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: release-artifacts
