name: Staging

on:
  push:
    branches: [main]

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.git_sha.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v6

      - name: Read image tag
        id: git_sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::149536470839:role/system/github_actions
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push Part Viewer
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.git_sha.outputs.short_sha }}
        run: |
          CACHE_REF="$ECR_REGISTRY/part-viewer:buildcache"
          docker buildx build \
            --file apps/part-viewer/Dockerfile \
            --target prod \
            --platform linux/amd64 \
            --tag "$ECR_REGISTRY/part-viewer:$IMAGE_TAG" \
            --cache-from "type=registry,ref=$CACHE_REF" \
            --cache-to "type=registry,ref=$CACHE_REF,mode=max,image-manifest=true" \
            --push \
            .

  deploy:
    needs: build
    uses: toolpath/cicd-workflows/.github/workflows/_deploy.yaml@latest
    secrets: inherit
    with:
      environment: staging
      application: part-viewer
      image_tag: ${{ needs.build.outputs.image_tag }}
