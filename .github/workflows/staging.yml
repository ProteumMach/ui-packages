name: Staging

on:
  push:
    branches: [main]

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  quality:
    uses: ./.github/workflows/_quality.yml

  build:
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.git_sha.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v6

      - name: Read image tag
        id: git_sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::149536470839:role/system/github_actions
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push Part Viewer
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.git_sha.outputs.short_sha }}
        run: |
          CACHE_REF="$ECR_REGISTRY/part-viewer:buildcache"
          docker buildx build \
            --file apps/part-viewer/Dockerfile \
            --target prod \
            --platform linux/amd64 \
            --tag "$ECR_REGISTRY/part-viewer:$IMAGE_TAG" \
            --cache-from "type=registry,ref=$CACHE_REF" \
            --cache-to "type=registry,ref=$CACHE_REF,mode=max,image-manifest=true" \
            --push \
            .

      # GovCloud dual-push. The gov cluster serves part-viewer at dfm.toolpath.com,
      # so copy the image into the gov ECR (pulled in-account / in-partition). This
      # is a registry-to-registry manifest copy — no rebuild. The commercial ECR
      # login above stays in the docker config for the read side; we add the gov ECR
      # login for the write side. OIDC federates aws -> aws-us-gov;
      # unset-current-credentials forces a clean web-identity assume (a
      # cross-partition role-chain from the commercial creds would fail).
      - name: Configure GovCloud AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws-us-gov:iam::570117457787:role/system/github_actions
          role-session-name: GitHub_to_GovAWS_via_FederatedOIDC
          aws-region: us-gov-east-1
          unset-current-credentials: true

      - name: Login to GovCloud Amazon ECR
        id: login-ecr-gov
        uses: aws-actions/amazon-ecr-login@v2

      - name: Copy Part Viewer to GovCloud ECR
        env:
          IMAGE_TAG: ${{ steps.git_sha.outputs.short_sha }}
        run: |
          docker buildx imagetools create \
            --tag "${{ steps.login-ecr-gov.outputs.registry }}/part-viewer:$IMAGE_TAG" \
            "${{ steps.login-ecr.outputs.registry }}/part-viewer:$IMAGE_TAG"

  deploy:
    needs: build
    uses: toolpath/cicd-workflows/.github/workflows/_deploy.yaml@latest
    secrets: inherit
    with:
      environment: staging
      application: part-viewer
      image_tag: ${{ needs.build.outputs.image_tag }}
