name: Production (GovCloud)

# Promote a specific `main` commit's part-viewer image to GovCloud production. The
# image is built once on `main` (staging.yml) and tagged with the 7-char git sha in
# the commercial ECR. This workflow is triggered manually (GitHub Releases are used
# for npm package publishing and must NOT deploy the part-viewer): given a git sha,
# it verifies commercial staging is already running that exact sha and is healthy,
# copies the image into the gov ECR, then points the gov ArgoCD
# part-viewer-production app at the sha and syncs.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full or short git sha of the main commit to promote (must already be built & healthy in commercial part-viewer staging).
        required: true
        type: string

permissions:
  id-token: write # assume the commercial + gov AWS OIDC roles
  packages: read
  contents: read

jobs:
  # Validate the dispatched sha and normalize it to the 7-char tag used by the
  # commercial ECR image and the ArgoCD sync.
  git_sha:
    runs-on: ubuntu-latest
    outputs:
      short-sha-7: ${{ steps.normalize.outputs.short }}
    steps:
      - name: Normalize input sha to 7 chars
        id: normalize
        run: |
          raw="${{ inputs.sha }}"
          raw="${raw,,}" # lowercase; git shas / ECR tags are lowercase
          if [[ ! "$raw" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::Input sha '${{ inputs.sha }}' is not a valid 7-40 char hex git sha"
            exit 1
          fi
          echo "short=${raw:0:7}" >> "$GITHUB_OUTPUT"

  # Gate: commercial part-viewer-staging must already be running the released sha AND
  # be healthy.
  ensure_staging:
    uses: toolpath/cicd-workflows/.github/workflows/_check_current_version.yaml@latest
    secrets: inherit
    needs: git_sha
    with:
      application: part-viewer
      environment: staging
      image_tag: ${{ needs.git_sha.outputs.short-sha-7 }}

  # Copy the released image from the commercial ECR into the gov ECR (the gov cluster
  # pulls it in-account / in-partition). Registry-to-registry manifest copy, no
  # rebuild. unset-current-credentials forces a clean web-identity assume for the gov
  # role (a cross-partition role-chain from the commercial creds would fail).
  copy_to_gov_ecr:
    needs: git_sha
    runs-on: ubuntu-latest
    steps:
      - name: Configure commercial AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::149536470839:role/system/github_actions
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: us-east-1

      - name: Login to commercial Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Configure GovCloud AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws-us-gov:iam::570117457787:role/system/github_actions
          role-session-name: GitHub_to_GovAWS_via_FederatedOIDC
          aws-region: us-gov-east-1
          unset-current-credentials: true

      - name: Login to GovCloud Amazon ECR
        id: login-ecr-gov
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Copy part-viewer to GovCloud ECR
        run: |
          gov_registry="${{ steps.login-ecr-gov.outputs.registry }}"
          registry="${{ steps.login-ecr.outputs.registry }}"
          sha="${{ needs.git_sha.outputs.short-sha-7 }}"
          docker buildx imagetools create \
            --tag "${gov_registry}/part-viewer:${sha}" \
            "${registry}/part-viewer:${sha}"

  # Point the gov ArgoCD part-viewer-production app at the released sha and sync.
  # Gated on both the staging check and the image copy. The production-govcloud
  # environment is the manual-approval hook.
  deploy_govcloud:
    needs:
      - git_sha
      - ensure_staging
      - copy_to_gov_ecr
    runs-on: ubuntu-latest
    environment: production-govcloud
    steps:
      - name: Install Argo CD CLI
        run: |
          curl -sSL -o argocd \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          sudo install -m 0555 argocd /usr/local/bin/argocd
      - name: Set image tag & sync part-viewer-production on GovCloud
        env:
          ARGOCD_SERVER: argocd.prod-govcloud.toolpath.com
          ARGOCD_AUTH_TOKEN: ${{ secrets.GOV_ARGOCD_TOKEN }}
          ARGOCD_OPTS: --grpc-web
        run: |
          argocd app set part-viewer-production \
            --helm-set-string global.image.tag=${{ needs.git_sha.outputs.short-sha-7 }}
          argocd app sync part-viewer-production --timeout 600
          argocd app wait part-viewer-production --health --timeout 600
