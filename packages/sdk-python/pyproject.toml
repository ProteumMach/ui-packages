[project]
name = "toolpath"
version = "0.1.0"
description = "Python bindings and upload helper for the Toolpath Engine API"
authors = [{ name = "Toolpath" }]
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    "httpx>=0.23.1,<0.29.0",
    "attrs>=22.2.0",
]

[project.urls]
Homepage = "https://developers.toolpath.com"
Repository = "https://github.com/toolpath/toolpath"
Issues = "https://github.com/toolpath/toolpath/issues"

[tool.uv.build-backend]
module-name = "toolpath"
module-root = ""

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "I", "UP"]

[tool.toolpath]
openapi-sha256 = "c818038ff8057bb76e9ee44935b3215d4accf89e763e39e8226232975ec73f13"
openapi-version = "1.3.2"
