[project]
name = "toolpath"
version = "1.0.0"
description = "Async Python SDK for the Toolpath Engine API"
authors = [{ name = "Toolpath" }]
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    "httpx>=0.23.1,<0.29.0",
    "attrs>=22.2.0",
]

[project.urls]
Homepage = "https://developers.toolpath.com"
Repository = "https://github.com/toolpath/toolpath"
Issues = "https://github.com/toolpath/toolpath/issues"

[tool.uv.build-backend]
module-name = "toolpath"
module-root = ""

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "I", "UP"]

[tool.toolpath]
openapi-sha256 = "ddb883006dd0fb25587eb91fe98e4bf0693e7664e12ae8319fb36b240dde7949"
openapi-version = "1.0.0"
